<style>
:root{
  color-scheme:dark;
  --bg:#08090D;--card:#13151D;--card-2:#1B1E29;--card-3:#242837;--line:#252938;
  --text:#F3F4F8;--text-2:#C3C6D4;--muted:#858AA0;
  --accent:#7C62FF;--accent-2:#B3A4FF;--accent-soft:rgba(124,98,255,.16);
  --good:#3DDC97;--good-soft:rgba(61,220,151,.14);--warn:#FFB547;--warn-soft:rgba(255,181,71,.14);--bad:#FF6B6B;--bad-soft:rgba(255,107,107,.14);
  --hero:linear-gradient(150deg,#7458FF 0%,#4B33C9 48%,#23195F 100%);
  --sans:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:8px 120px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 16px}
.hdr h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.hdr .hi{font-size:13px;color:var(--muted);font-weight:500}
.avatar{width:40px;height:40px;border-radius:14px;background:var(--card-2);display:grid;place-items:center;font-weight:700;color:var(--accent-2)}

.card{background:var(--card);border-radius:22px;padding:18px}
.stack{display:grid;gap:12px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch h2{margin:0;font-size:16px;font-weight:700}
.ch a,.ch button.lnk{color:var(--accent-2);font-size:13px;font-weight:600;cursor:pointer}

.hero{background:var(--hero);border-radius:26px;padding:22px 20px 20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);pointer-events:none}
.hero .k{font-size:13px;font-weight:600;color:rgba(255,255,255,.75)}
.hero .v{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-block:6px 4px;color:#fff}
.hero .v small{font-size:24px;font-weight:700;opacity:.7;margin-right:2px}
.hero .s{font-size:13px;color:rgba(255,255,255,.78)}
.hbar{height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin-top:16px}
.hbar i{display:block;height:100%;background:#fff;border-radius:99px}
.hfoot{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:rgba(255,255,255,.8);font-weight:600}

.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini{background:var(--card);border-radius:18px;padding:14px 12px}
.mini .k{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.mini .v{font-size:17px;font-weight:700;margin-top:6px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.banner{background:var(--card-2);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.banner p{margin:0;color:var(--text-2);font-size:14px}
.banner b{color:var(--text)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:15px;font-weight:700;font-size:15px;background:var(--card-3);color:var(--text)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}

.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:18px;padding:14px 12px;display:grid;gap:10px;text-align:left}
.tile .ico{width:36px;height:36px;font-size:18px;border-radius:12px}
.tile .n{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:16px;font-weight:700}

.tx{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;width:100%;text-align:left}
.tx .t{min-width:0}
.tx .t div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t div:last-child{font-size:12px;color:var(--muted);margin-top:2px}
.tx .a{font-weight:700;text-align:right}
.dayh{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:18px;margin-bottom:2px}
.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:14px}

.mswitch{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:4px;margin-bottom:12px}
.mswitch span{font-weight:700}
.iconb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text-2)}
.iconb:hover{background:var(--card-2)}
.iconb:disabled{opacity:.25;cursor:default;background:none}

.donutwrap{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:center}
.donut{position:relative;width:132px;height:132px}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}

 if(mode!=='live')return;if(!force&&(S.settings.autoRates===false||!navigator.onLine))return;

 const urls=['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json','https://latest.currency-api.pages.dev/v1/currencies/usd.json'];
 for(const u of urls){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;const j=await r.json();const t=+j.usd.try,x=+j.usd.xau;if(!(t>1))continue;
  const now=new Date();const st={...S.settings,fx:{usdtry:Math.round(t*10000)/10000,asOf:`${todayISO}T${pad(now.getHours())}:${pad(now.getMinutes())}`,source:'currency-api (market)',auto:true,dataDate:j.date}};
  if(x>0){const g=Math.round((1/x)/31.1034768*t);st.gold={gram:g,ceyrek:Math.round(g*COIN.ceyrek),yarim:Math.round(g*COIN.yarim),tam:Math.round(g*COIN.tam),cumhuriyet:Math.round(g*COIN.cumhuriyet),asOf:todayISO,auto:true}}
  putSettings(st);snapNW();if(force)toast(`Rates updated · USD/TRY ${rateTxt(t)}`);return}catch(e){}}
 if(force)toast('Couldn’t reach the rate service. Enter rates in Rates & prices instead.');

/* ---------- numbers ---------- */
let memo={};
function spent(m){const k='s'+m;if(memo[k]!=null)return memo[k];let t=0;for(const x of S.expenses.values())if(x.month===m)t+=+x.amount||0;return memo[k]=t}
function byCat(m){const o={};for(const x of S.expenses.values())if(x.month===m)o[x.cat]=(o[x.cat]||0)+(+x.amount||0);return o}
const fixedTotal=()=>(S.settings.fixed||[]).reduce((s,f)=>s+(+f.amount||0),0);
function avgVar(){
 const ms=[1,2,3].map(k=>addM(CUR,-k)).filter(m=>spent(m)>0);
 if(ms.length)return {v:ms.reduce((s,m)=>s+spent(m),0)/ms.length,basis:`avg of last ${ms.length} month${ms.length>1?'s':''}`};
 const d=T.getDate(),cur=spent(CUR);
 if(cur>0&&d>=7)return {v:cur/d*daysIn(CUR),basis:'projected from this month'};
 return {v:baseIncome()*.3,basis:'estimate until you log a month'};
}
const pots=()=>[...S.pots.values()].sort((a,b)=>(a.order||0)-(b.order||0));
const DEFAULT_RATE=48.855;
const sal=()=>S.settings.salary&&+S.settings.salary.usd?S.settings.salary:null;
const mkt=()=>S.settings.fx&&+S.settings.fx.usdtry?S.settings.fx:null;
const fxRate=()=>{const s=sal(),m=mkt();if(m&&(!s||!s.rateAsOf||(m.asOf||'').slice(0,10)>=s.rateAsOf))return (+m.usdtry)*(s&&+s.spread?+s.spread:1);return s?(+s.rate||DEFAULT_RATE):(m?+m.usdtry:DEFAULT_RATE)};
const fxNote=()=>{const m=mkt(),s=sal();if(m){const d=(m.asOf||'').slice(0,10);return `USD/TRY ${rateTxt(m.usdtry)} · updated ${d===todayISO?'today':dayLabel(d)}${s&&+s.spread&&+s.spread!==1?` · your bank gives about ${rateTxt(fxRate())}`:''}`}return s?`Rate ${rateTxt(s.rate)} from ${dayLabel(s.rateAsOf||todayISO).toLowerCase()}`:''};
const baseIncome=()=>{const s=sal();return s?(+s.usd)*fxRate():(+S.settings.income||0)};
const usd=n=>'$'+nf.format(Math.round(n||0));
const rateTxt=r=>(+r).toLocaleString('tr-TR',{maximumFractionDigits:2});
function paycheck(m){const pc=S.paychecks.get(m),s=sal();
 if(pc&&pc.received)return {try:+pc.try||0,usd:+pc.usd||0,rate:+pc.rate||0,received:true,date:pc.date};
 const u=pc&&+pc.usd?+pc.usd:(s?+s.usd:0);
 if(u)return {try:u*fxRate(),usd:u,rate:fxRate(),received:false,custom:!!(pc&&+pc.usd)};
 return {try:+S.settings.income||0,usd:0,received:false}}
const goldP=()=>({...DEFAULT_GOLD,...(S.settings.gold||{})});
const goldValue=h=>{const p=goldP();return GOLD.reduce((s,[k])=>s+(+(h.units||{})[k]||0)*(+p[k]||0),0)};
function loanInfo(h){const pmt=+h.installment||0;if(h.paidOff||!h.endMonth||!pmt)return {n:0,remaining:0,pmt,total:0};let n=monthsBetween(CUR,h.endMonth)+((+h.payDay||1)>=T.getDate()?1:0);n=Math.max(0,n);const r=(+h.rate||0)/100;const remaining=r>0?pmt*(1-Math.pow(1+r,-n))/r:pmt*n;return {n,remaining,pmt,total:pmt*n}}
const nextPayMonth=day=>(+day||1)>=T.getDate()?CUR:addM(CUR,1);
const payDate=(m,day)=>`${m}-${pad(Math.min(+day||1,daysIn(m)))}`;
const dateShort=d=>{const[y,mo,dd]=d.split('-').map(Number);return new Date(y,mo-1,dd).toLocaleString('en-GB',{day:'numeric',month:'short'})};
const cardSpent=(cardId,fromISO)=>{let t=0;for(const x of S.expenses.values())if(x.pay===cardId&&x.date>=fromISO)t+=+x.amount||0;return t};
const cardStmtStart=h=>{const sd=+h.statementDay;if(!sd)return null;const m=T.getDate()>sd?CUR:addM(CUR,-1);return iso(new Date(+m.slice(0,4),+m.slice(5)-1,Math.min(sd,daysIn(m))+1))};
const cardRate=h=>+h.rate||((+h.limit||0)<30000?3.25:(+h.limit||0)<=180000?3.75:4.25);
function hv(h){switch(h.type){case 'bank':case 'cash':return +h.balance||0;case 'gold':return goldValue(h);case 'car':return +h.value||0;case 'owed':return Math.max(0,(+h.amount||0)-(+h.paid||0));case 'card':return -((+h.balance||0)+(+h.installments||0));case 'loan':return -loanInfo(h).remaining;default:return 0}}
function wallet(){if(memo.w)return memo.w;let assets=0,debts=0;for(const h of S.holdings.values()){const v=hv(h);if(v>=0)assets+=v;else debts-=v}return memo.w={assets,debts,net:assets-debts}}
const holdings=t=>[...S.holdings.values()].filter(h=>t.includes(h.type));
function plan(){
 if(memo.plan)return memo.plan;
 const loans=holdings(['loan']).map(h=>({h,...loanInfo(h)})).filter(l=>l.n>0);
 const loanPay=loans.reduce((s,l)=>s+l.pmt,0);
 const income=baseIncome(),fixed=fixedTotal()+loanPay,av=avgVar(),rate=+S.settings.rate||0;
 const free=Math.max(0,income-fixed-av.v);
 const rateTarget=income*rate;
 const debtItems=holdings(['card']).filter(h=>!h.payInFull&&(+h.balance||0)>0).map(h=>{const bal=+h.balance,months=Math.max(1,+h.payoffMonths||4);return {kind:'debt',h,p:{id:'debt:'+h.id,name:'Pay off '+(h.name||'card'),e:'💳',color:'#FF6B6B',due:addM(CUR,months-1),target:bal,saved:0},left:bal,need:Math.ceil(bal/months/100)*100,months,alloc:0,interest:bal*cardRate(h)/100}});
 const list=debtItems.concat(pots().map(p=>{const left=Math.max(0,(+p.target||0)-(+p.saved||0));let need=0,months=null;if(p.due&&left>0){months=Math.max(1,monthsBetween(CUR,p.due));need=Math.ceil(left/months/100)*100}return {kind:'pot',p,left,need,months,alloc:0}}));
 const required=list.reduce((s,x)=>s+x.need,0);
 let rec=Math.min(Math.max(required,rateTarget),free);
 rec=Math.floor(rec/500)*500;
 let rem=rec;
 list.forEach(x=>{const a=Math.min(x.need,rem);x.alloc=a;rem-=a});
 while(rem>=100){const open=list.filter(x=>x.left>x.alloc);if(!open.length)break;const tgt=open.find(x=>!x.p.due)||open[0];const a=Math.min(rem,tgt.left-tgt.alloc);tgt.alloc+=a;rem-=a}
 list.forEach(x=>{x.alloc=Math.round(x.alloc/100)*100;if(x.left<=0){x.status='done'}else if(x.alloc<=0){x.status='stalled'}else{x.eta=addM(CUR,Math.ceil(x.left/x.alloc));x.status=!x.p.due?'flex':x.eta<=x.p.due?'ontime':'late';x.lateBy=x.p.due?monthsBetween(x.p.due,x.eta):0}});
 const total=list.reduce((s,x)=>s+x.alloc,0);
 const planned=list.length?total:rec;
 let status,label;
 if(income<=0){status='warn';label='Add your income'}
 else if(!list.length){status='warn';label='Create a pot to put this in'}
 else if(total>=required&&total>=rateTarget-500){status='good';label='On track'}
 else if(total>=required){status='warn';label=`Goals covered, under your ${Math.round(rate*100)}% target`}
 else{status='bad';label=`Short ${money(required-total)}/mo to hit every deadline`}
 return memo.plan={income,fixed,loanPay,av,rate,free,rateTarget,required,total:planned,list,debts:list.filter(x=>x.kind==='debt'),potList:list.filter(x=>x.kind==='pot'),status,label,spendable:Math.max(0,income-fixed-planned)};
}

const payday=()=>Math.min(28,Math.max(1,+S.settings.payday||1));
function periodOf(d){const[y,m,dd]=d.split('-').map(Number);const pd=payday();const cm=`${y}-${pad(m)}`;const sm=dd>=pd?cm:addM(cm,-1);return {start:`${sm}-${pad(pd)}`,end:`${addM(sm,1)}-${pad(pd)}`}}

function cycle(ref){ // budget for the pay period containing `ref`
 ref=ref||todayISO;const key='cy'+ref;if(memo[key])return memo[key];
 const P=plan(),per=periodOf(ref),st=S.settings.start||null;
 const opening=!!(st&&st.date>=per.start&&st.date<per.end);
 const inWin=d=>(opening?d>st.date:d>=per.start)&&d<per.end;
 const items=[];
 if(opening)items.push({l:`Money in your accounts on ${dateShort(st.date)}`,v:+st.cash||0});
 else{const pm=per.start.slice(0,7),pc=paycheck(pm),base=sal()?+sal().usd:0;
  items.push({l:pc.received?`Salary received${pc.usd?` · ${usd(pc.usd)} @ ${rateTxt(pc.rate)}`:''}`:`Salary expected ${dateShort(per.start)}${pc.usd?` · ${usd(pc.usd)} × ${rateTxt(pc.rate)}`:''}`,v:pc.try,pay:pm,extra:pc.usd&&base&&pc.usd>base?(pc.usd-base):0});
  if(st){const prev=periodOf(addDaysISO(per.start,-1));if(st.date>=prev.start&&st.date<prev.end){const c=cycle(prev.start);items.push({l:ref>todayISO?'Left over from now (projected)':'Left over from last period',v:c.left})}}}
 for(const h of holdings(['owed']))if(h.paidOn&&(+h.paid||0)>0&&inWin(h.paidOn))items.push({l:`${h.person} paid you back`,v:+h.paid});
 const fx=S.settings.fixed||[];
 if(opening){fx.forEach(f=>{if(f.day)datesIn(f.day,per,inWin).forEach(()=>items.push({l:f.name,v:-(+f.amount||0)}))})}
 else{const t=fx.reduce((a,f)=>a+(+f.amount||0),0);if(t)items.push({l:'Fixed costs',v:-t})}
 for(const h of holdings(['loan'])){if(h.paidOff||!h.endMonth)continue;const last=payDate(h.endMonth,h.payDay);datesIn(h.payDay,per,d=>inWin(d)&&d<=last).forEach(dt=>items.push({l:`${h.name} · ${dateShort(dt)}`,v:-(+h.installment||0)}))}
 if(st&&st.cards)for(const [cid,c] of Object.entries(st.cards)){const h=S.holdings.get(cid);if(!h)continue;const due=cardCarryDue(h,c.from||st.date);if(due&&inWin(due))items.push({l:`${h.name} bill from before Kasa · ${dateShort(due)}`,v:-(+c.amt||0),card:1})}
 let before=items.reduce((a,x)=>a+x.v,0),sav=0;
 if(!opening&&P.total>0){sav=before>0?Math.min(P.total,before):0;items.push({l:sav<P.total?`Savings plan (cut to ${money(sav)}: not enough room)`:'Savings plan',v:-sav})}

 let sp=0;if(ref<=todayISO)for(const x of S.expenses.values())if(inWin(x.date)&&x.date<=todayISO)sp+=+x.amount||0;
 const left=budget-sp;const dLeft=Math.max(1,daysUntil(per.end));
 const pcm=opening?null:per.start.slice(0,7);

function donut(entries,total){

 const segs=entries.map(([id,v])=>{const len=v/total*C;const gap=entries.length>1?2:0;const s=`<circle r="${R}" cx="66" cy="66" fill="none" stroke="${cat(id).c}" stroke-width="16" stroke-dasharray="${Math.max(0,len-gap).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 66 66)"/>`;off+=len;return s}).join('');
 return `<svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true"><circle r="${R}" cx="66" cy="66" fill="none" stroke="var(--card-3)" stroke-width="16"/>${segs}</svg>`;
}

async function reorder(id,dir){

async function toggleMove(id,amt){
 const doc=S.moves.get(CUR)||{month:CUR,done:{}};const done={...(doc.done||{})};
 if(id.startsWith('debt:')){const h=S.holdings.get(id.slice(5));if(!h)return;let bal=+h.balance||0;
  if(done[id]){bal+=(+done[id]||0);delete done[id]}else{done[id]=amt;bal=Math.max(0,bal-amt)}
  await put('holdings',h.id,{...clean(h),balance:bal,updated:todayISO});await put('moves',CUR,{...clean(doc),month:CUR,done});snapNW();
  if(done[id])toast(`💳 ${money(amt)} paid toward ${h.name}`);return}
 const p=S.pots.get(id);if(!p)return;
 let saved=+p.saved||0;
 if(done[id]){saved=Math.max(0,saved-(+done[id]||0));delete done[id]}
 else{done[id]=amt;saved+=amt}
 await put('pots',id,{...clean(p),saved});
 await put('moves',CUR,{...clean(doc),month:CUR,done});
 if(done[id])toast(`${p.e} ${money(amt)} added to ${p.name}`);
}

  (!n&&left>0?`<button type="button" class="btn block" data-act="owedpaid" style="margin-top:14px;background:var(--good-soft);color:var(--good)">✓ Paid back in full</button>`:'')}
 openSheet(`${head((n?'Add ':'')+HT[type].n)}<form id="holdForm" data-type="${type}" data-id="${n?'':esc(h.id)}">${body}
  <div class="sf">${n?'':'<button type="button" class="btn danger" data-act="delhold" style="flex:0 0 auto">Delete</button>'}<button class="btn primary" type="submit">${n?'Add':'Save'}</button></div></form>`);
}
function saveHold(f){
 const type=f.dataset.type,id=f.dataset.id||uid('h'),old=S.holdings.get(id)||{};const v=i=>{const e=$('#'+i);return e?e.value.trim():''};const num=i=>parseAmt(v(i));
 const d={type,updated:todayISO};if(old.sample)d.sample=true;
 if(type==='bank'||type==='cash'){d.name=v('hName')||HT[type].n;d.balance=num('hBal');if(type==='bank')d.kind=segVal('hKind');if(isNaN(d.balance)){toast('Enter the balance.');return}}
 if(type==='gold'){d.name=v('hName')||'Gold';d.units={};GOLD.forEach(([k])=>{const x=num('gu-'+k);if(x>0)d.units[k]=x});
  const gp=goldP();let ch=false;const ng={...gp};GOLD.forEach(([k])=>{const x=num('gp-'+k);if(x>0&&x!==+gp[k]){ng[k]=x;ch=true}});if(ch){ng.asOf=todayISO;S.settings={...S.settings,gold:ng};putSettings(S.settings)}}
 if(type==='car'){d.name=v('hName')||'Car';d.model=v('hModel');d.year=num('hYear')||'';d.km=num('hKm')||'';d.value=num('hVal')||0;d.low=num('hLow')||'';d.high=num('hHigh')||'';d.valuedAt=d.value!==(+old.value||0)?todayISO:(old.valuedAt||todayISO);d.source=d.value!==(+old.value||0)?'Entered by you':(old.source||'')}
 if(type==='card'){d.name=v('hName')||'Credit card';d.balance=num('hBal')||0;d.installments=num('hInstl')||0;d.statementDay=Math.min(31,Math.max(0,parseInt(v('hStmt'))||0))||'';d.limit=num('hLim')||0;d.dueDay=Math.min(31,Math.max(0,parseInt(v('hDue'))||0))||'';d.rate=num('hRate')||'';d.payInFull=segVal('hPif')==='1';d.payoffMonths=+segVal('hPo')||4}
 if(type==='loan'){d.name=v('hName')||'Loan';d.installment=num('hInst')||0;d.payDay=Math.min(31,parseInt(v('hDay'))||1);d.rate=num('hRate')||0;const left=parseInt(v('hLeft'))||0;if(!d.installment||!left){toast('Add the monthly payment and how many payments are left.');return}d.endMonth=addM(nextPayMonth(d.payDay),left-1)}
 if(type==='owed'){d.person=v('hPerson');d.amount=num('hAmt');d.due=v('hDueD');d.paid=num('hPaid')||0;d.note=v('hNote');if(!d.person||!(d.amount>0)){toast('Add a name and an amount.');return}}
 closeSheet();put('holdings',id,d);if(type==='card'&&!f.dataset.id&&d.balance>0&&S.settings.start){const st={...S.settings.start,cards:{...(S.settings.start.cards||{}),[id]:{amt:d.balance,from:todayISO}}};putSettings({...S.settings,start:st})}snapNW();toast(`${HT[type].e} ${f.dataset.id?'Updated':'Added'}`);
}
function paySheet(cid){
 const c=S.holdings.get(cid);const banks=holdings(['bank','cash']);
 openSheet(`${head('Pay '+esc(c.name))}<form id="payForm" data-id="${esc(cid)}">
  <p class="muted" style="margin:0">Use this on payment day. It lowers the card balance and takes the money from the account you pick. Paying the card isn’t an expense: you already logged those purchases.</p>
  ${fld('pAmt','Amount paid ₺',c.balance,{num:1,af:1})}
  <div class="hint">Card balance now: ${money(c.balance)}. If you pay just the statement amount, type that here (it’s in your bank app).</div>
  ${banks.length?`<div class="fl"><span>Paid from</span>${segH('pFrom',banks.map(b=>[b.id,b.name]).concat([['none','Don’t change']]),banks[0].id)}</div>`:''}
  <div class="sf"><button class="btn primary" type="submit">Record payment</button></div></form>`);
}
function savePay(f){
 const c=S.holdings.get(f.dataset.id),amt=parseAmt($('#pAmt').value);if(!(amt>0)){toast('Enter the amount you paid.');return}
 const from=segVal('pFrom');closeSheet();
 put('holdings',c.id,{...clean(c),balance:Math.max(0,Math.round(((+c.balance||0)-amt)*100)/100),lastPaid:todayISO,updated:todayISO});
 if(from&&from!=='none'){const b=S.holdings.get(from);if(b)put('holdings',b.id,{...clean(b),balance:Math.round(((+b.balance||0)-amt)*100)/100,updated:todayISO})}
 snapNW();toast(`💳 ${money(amt)} paid to ${c.name}`);
}
async function removeSample(btn){
 if(btn.dataset.c!=='1'){btn.dataset.c='1';btn.textContent='Tap again to remove';return}
 btn.disabled=true;for(const c of COLS)for(const [id,d] of [...S[c]])if(d.sample){S[c].delete(id);try{await db.collection(c).doc(id).delete()}catch(e){}}
 closeSheet();render();toast('Sample data removed');
}

let tt;function toast(m){const t=$('#toast');t.innerHTML=esc(m).replace(EMO_RE,emImg);t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

const ACT={
 tab:el=>{ui.tab=el.dataset.tab;if(ui.tab!=='expenses'){ui.month=CUR;ui.fcat=''}try{localStorage.setItem('kasa2.tab',ui.tab)}catch(e){}closeSheet();draw();window.scrollTo(0,0)},
 add:()=>expSheet(),
 edit:el=>expSheet(S.expenses.get(el.dataset.id)),
 saveexp:()=>saveExp(),
 delexp:()=>{const id=kp.id,old=S.expenses.get(id);closeSheet();del('expenses',id);cardAdjust(old,null);toast('Expense deleted')},
 paycard:()=>paySheet($('#holdForm').dataset.id),
 salary:el=>salarySheet(el.dataset.m),
 salundo:()=>{const m=$('#salForm').dataset.m,o=S.paychecks.get(m);closeSheet();if(o&&o.depositTo&&o.depositTo!=='none'){const b=S.holdings.get(o.depositTo);if(b)put('holdings',b.id,{...clean(b),balance:Math.round((+b.balance||0)-(+o.try||0)),updated:todayISO})}put('paychecks',m,{month:m,usd:+o.usd||0,received:false});snapNW();toast('Salary marked as not arrived')},
 rates:()=>ratesSheet(),
 refreshrates:()=>fetchRates(true),
 exportbk:()=>{try{const o={kasa:1,exported:todayISO,settings:S.settings};COLS.forEach(c=>{o[c]={};S[c].forEach((d,id)=>{o[c][id]=clean(d)})});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download=`kasa-backup-${todayISO}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Backup saved')}catch(e){toast('Couldn’t create the backup file.')}},
 quickpay:()=>{const c=holdings(['card'])[0];if(c)paySheet(c.id);else holdSheet('card')},
 loanoff:()=>{const id=$('#holdForm').dataset.id,h=S.holdings.get(id);closeSheet();put('holdings',id,{...clean(h),paidOff:true,paidOffOn:todayISO});snapNW();toast(`📄 ${h.name} paid off 🎉`)},
 close:()=>closeSheet(),
 mprev:()=>{ui.month=addM(ui.month,-1);ui.fcat='';draw()},
 mnext:()=>{if(ui.month<CUR){ui.month=addM(ui.month,1);ui.fcat='';draw()}},
 fcat:el=>{ui.fcat=ui.fcat===el.dataset.cat?'':el.dataset.cat;draw()},
 catjump:el=>{ui.tab='expenses';ui.month=CUR;ui.fcat=el.dataset.cat;draw();window.scrollTo(0,0)},
 pot:el=>potSheet(el.dataset.id?S.pots.get(el.dataset.id):null),
 efpot:el=>potSheet(null,{name:'Emergency fund',e:'🛟',target:el.dataset.target}),
 delpot:()=>{const sh=$('#sheet');if(!sh.dataset.cd){sh.dataset.cd='1';toast('Tap Delete again to remove this pot');return}const id=$('#potForm').dataset.id;closeSheet();del('pots',id)},
 potup:()=>reorder($('#potForm').dataset.id,-1),
 potdown:()=>reorder($('#potForm').dataset.id,1),
 move:el=>toggleMove(el.dataset.id,+el.dataset.amt),
 income:()=>incomeSheet(false),
 setup:()=>incomeSheet(true),
 addfix:()=>{$('#fixList').insertAdjacentHTML('beforeend',fixedRow({e:'📌',name:'',amount:''}));$('#fixList').lastElementChild.querySelectorAll('input')[1].focus()},
 rmfix:el=>el.closest('.frow').remove(),
 settings:()=>settingsSheet(),
 rmsample:el=>removeSample(el),
 hold:el=>{const h=S.holdings.get(el.dataset.id);if(h)holdSheet(h.type,h)},
 newhold:el=>el.dataset.type?holdSheet(el.dataset.type):chooserSheet(),
 delhold:()=>{const sh=$('#sheet');if(!sh.dataset.cd){sh.dataset.cd='1';toast('Tap Delete again to remove it');return}const id=$('#holdForm').dataset.id;closeSheet();del('holdings',id);snapNW()},
 owedpaid:()=>{const id=$('#holdForm').dataset.id,h=S.holdings.get(id);const got=(+h.amount||0)-(+h.paid||0);closeSheet();put('holdings',id,{...clean(h),paid:+h.amount,paidOn:todayISO});const b=holdings(['bank'])[0];if(b&&got>0)put('holdings',b.id,{...clean(b),balance:(+b.balance||0)+got,updated:todayISO});snapNW();toast(`🤝 ${h.person} paid you back · ${money(got)} added${b?' to '+b.name:''}`)}
};
document.addEventListener('click',e=>{
 const t=e.target;
 const k=t.closest('[data-k]');if(k){kpKey(k.dataset.k);return}
 const kc=t.closest('[data-kc]');if(kc&&kp){kp.cat=kc.dataset.kc;kpDraw();return}
 const kpy=t.closest('[data-kpay]');if(kpy&&kp){kp.pay=kpy.dataset.kpay;kpDraw();return}
 const kw=t.closest('[data-kw]');if(kw&&kp){kp.who=kw.dataset.kw;kpDraw();return}
 const kd=t.closest('[data-kd]');if(kd&&kp){kp.date=kd.dataset.kd;$('#kdi').value=kp.date;kpDraw();return}
 const sv=t.closest('.seg [data-sv]');if(sv){sv.parentElement.querySelectorAll('.on').forEach(b=>b.classList.remove('on'));sv.classList.add('on');if(sv.parentElement.id==='hPif')$('#payoffRow').hidden=sv.dataset.sv==='1';if(sv.parentElement.id==='iCur'){$('#curUsd').hidden=sv.dataset.sv!=='usd';$('#curTry').hidden=sv.dataset.sv!=='try'}return}
 const pe=t.closest('[data-pe]');if(pe){document.querySelectorAll('#pe button').forEach(b=>b.classList.toggle('on',b===pe));return}
 const el=t.closest('[data-act]');if(el&&!el.disabled&&ACT[el.dataset.act]){e.preventDefault();ACT[el.dataset.act](el,e)}
});
$('#scrim').addEventListener('mousedown',e=>{if(e.target.id==='scrim')closeSheet()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id==='rateForm')saveRates();else if(f.id==='holdForm')saveHold(f);else if(f.id==='payForm')savePay(f);else if(f.id==='salForm')saveSalary(f,e.submitter);else if(f.id==='potForm')savePot(f);else if(f.id==='incForm')saveIncome(f);
 else if(f.id==='setForm'){const st=JSON.parse(JSON.stringify(S.settings));st.people[0].name=$('#sn0').value.trim()||st.people[0].name;st.people[1].name=$('#sn1').value.trim()||st.people[1].name;closeSheet();putSettings(st);toast('Saved')}
});
let rateT;
document.addEventListener('change',e=>{
 if(e.target.id==='impBackup'&&e.target.files&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(String(r.result));if(!o||!o.settings||!o.kasa)throw 0;loadData(o);mode='live';db=localDb;saveLocal();closeSheet();render();fetchRates();toast('Backup imported')}catch(err){toast('That file isn’t a Kasa backup.')}};r.readAsText(e.target.files[0])}
});
document.addEventListener('input',e=>{
 const id=e.target.id;
 if(id==='rate'){const v=+e.target.value;$('#rateOut').textContent=v+'%';$('#rateAmt').textContent=money((+S.settings.income||0)*v/100)+'/mo';clearTimeout(rateT);rateT=setTimeout(()=>putSettings({...S.settings,rate:v/100}),450)}
 if(id==='sRate')$('#sRateOut').textContent=e.target.value+'%';
 if(id==='kdi'&&kp&&e.target.value){kp.date=e.target.value;kpDraw()}
});
document.addEventListener('keydown',e=>{
 const open=!$('#scrim').hidden;
 if(e.key==='Escape'&&open){closeSheet();return}
 const tag=(e.target.tagName||'').toLowerCase();const typing=tag==='input'||tag==='textarea'||tag==='select';
 if(kp&&open&&!typing){if(/^\d$/.test(e.key)||e.key===','||e.key==='.'||e.key==='Backspace'){e.preventDefault();kpKey(e.key);return}if(e.key==='Enter'){e.preventDefault();saveExp();return}}
 if(!open&&!typing&&!e.metaKey&&!e.ctrlKey&&(e.key==='n'||e.key==='+')){e.preventDefault();expSheet()}
});

boot();
})();
</script>
